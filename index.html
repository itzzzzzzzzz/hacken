/* Open the inspector and the page is empty: not one element, only the line at the top. It comes back
   when the inspector is closed. console.table of a large table takes no time at all unless an
   inspector is attached and has to receive it. Nothing else is looked at, least of all the window's
   size, so a zoomed browser or a sidebar can never empty a running presentation. ?debug leaves it off. */
(function () {
  if (/[?&]debug\b/.test(location.search)) return;
  var table = console.table, clear = console.clear, clock = performance;
  var big = [], i, j, row, slow = 0, fast = 0, gone = false;
  for (i = 0; i < 80; i++) { row = {}; for (j = 0; j < 400; j++) row['k' + j] = 'value' + j; big.push(row); }
  function quiet(e) { e.preventDefault(); }
  function empty() {
    gone = true;
    addEventListener('error', quiet, true);
    addEventListener('unhandledrejection', quiet, true);
    try { window.stop(); } catch (e) {}
    try { __igloo.Q.emit('webgl_render_active', false); __igloo.re.ticker.sleep(); } catch (e) {}
    Array.prototype.slice.call(document.childNodes).forEach(function (node) { document.removeChild(node); });
    document.appendChild(document.createComment(' gemacht von mir. hier finden sie nichts '));
  }
  function look() {
    var t0 = clock.now();
    table(big);
    var took = clock.now() - t0;
    clear();
    if (took > 5) { slow++; fast = 0; } else { fast++; slow = 0; }
    if (!gone && slow >= 2) empty();
    if (gone && fast >= 3) location.reload();
  }
  look();
  setInterval(look, 250);
})();
</script>

<!-- inside PowerPoint the page is an Office add-in: Office's own script says it is there -->
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js" async></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600&display=swap');

/* Groove Dynamics' own measures: one paper, one ink, its curves */
:root{
  --paper:#FFFFFF;
  --ink:#0A0A0A;
  --e-io:cubic-bezier(.76,0,.24,1);
  --e-soft:cubic-bezier(.33,0,.2,1);
  --sans:"Inter Tight","Inter",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  /* the mark, at rest and while the deck loads: one size, one place */
  --m:clamp(32px,2.3vw,52px);
  --m-h:calc(var(--m) * 1.0096);
  --gap:calc(var(--m) * .42);
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  user-select:none;-webkit-user-select:none;touch-action:none}
/* a presentation has no pointer */
html,body,*{cursor:none!important}

/* the curtain: white, the mark, nothing else */
#pre{position:fixed;inset:0;z-index:100;background:var(--paper);pointer-events:none}
#pre svg{position:absolute;left:50%;top:50%;width:var(--m);height:var(--m-h);
  margin:calc(var(--m-h) * -.5) 0 0 calc(var(--m) * -.5);color:var(--ink);animation:pre-pulse 1.6s var(--e-io) infinite}
@keyframes pre-pulse{0%,100%{opacity:.35}50%{opacity:1}}
/* in PowerPoint, a slide for each step: until the page shows its step, the picture of it stands in */
#pre.is-slide{background:#fff center/cover no-repeat}
#pre.is-slide svg{display:none}
.still .lockup,.still .lockup-word span{transition:none!important}

/* ============================================================
   the slide on paper: the first, the size of the screen
   ============================================================ */
.pages{position:fixed;inset:0;z-index:1;overflow:hidden;background:var(--paper)}
.page{position:absolute;inset:0;background:var(--paper)}

/* the mark, where it stood while the deck loaded; it steps aside
   and the word comes out of it, softly, at the mark's right edge */
.lockup{position:absolute;left:50%;top:50%;width:var(--m);height:var(--m-h);
  margin:calc(var(--m-h) * -.5) 0 0 calc(var(--m) * -.5);color:var(--ink);
  transition:transform 1.8s var(--e-io)}
.lockup svg{display:block;width:100%;height:100%}
.lockup-word{position:absolute;left:100%;top:50%;transform:translateY(-50%);overflow:hidden;
  padding-left:var(--gap);white-space:nowrap;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 var(--gap));mask-image:linear-gradient(90deg,transparent 0,#000 var(--gap))}
.lockup-word span{display:block;font-size:calc(var(--m) * .66);font-weight:600;letter-spacing:-.03em;line-height:1.25;
  transform:translate3d(calc(-100% - var(--gap)),0,0);transition:transform 1.8s var(--e-io)}
.page.is-in .lockup{transform:translate3d(calc(var(--shift,0px) * -1),0,0)}
.page.is-in .lockup-word span{transform:none}

/* igloo's canvas lies over the slides and makes its own cut */
.scene{position:fixed;inset:0;z-index:5;pointer-events:none}
.scene canvas{display:block}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}
</style>
